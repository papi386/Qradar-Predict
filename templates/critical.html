<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Critical Offenses Dashboard</title>

<style>
  :root{
    --bg: #0f1720;
    --panel: #0b1620;
    --muted: #9aa7b0;
    --accent: #3fb0ff;
    --accent-2: #00d084;
    --danger: #ff8a65;
    --glass: rgba(255,255,255,0.03);
    --card-radius: 12px;
    --gap: 18px;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg,#07101a 0%, #07121a 100%);
    color:#e6f0f5;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding:22px;
  }

  header {
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:16px;
  }

  .logo {
    width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#2765ff);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#04121b;
    box-shadow:0 6px 18px rgba(15,40,60,0.6);
  }

  .title { font-size:18px;font-weight:600; }
  .top-actions{ margin-left:auto;display:flex;gap:10px;align-items:center; }
  .btn {
    background:var(--glass);border:1px solid rgba(255,255,255,0.03);padding:8px 12px;border-radius:999px;font-size:14px;color:var(--muted);
    cursor:pointer;
  }
  .btn.primary { background:linear-gradient(90deg,var(--accent),#60b6ff); color:#02111a; font-weight:600; padding:9px 14px; }

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:var(--card-radius);
    padding:14px;
    box-shadow: 0 6px 18px rgba(6,12,18,0.6);
    border:1px solid rgba(255,255,255,0.02);
    min-height:98px;
    margin-top:20px;
  }

  .chart-title { font-size:14px; color:var(--muted); margin-bottom:6px; }
  .list { display:flex; flex-direction:column; gap:8px; max-height:400px; overflow:auto; padding-right:6px; }
  .list .item { display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.01); padding:8px; border-radius:8px; font-size:13px; color:var(--muted); }
  .badge { padding:6px 10px; border-radius:999px; font-weight:700; font-size:13px; background:rgba(255,77,77,0.8); color:#fff; }

  footer { margin-top:18px; color:var(--muted); font-size:13px; text-align:center; }
</style>
</head>

<body>
<header>
  <div class="logo">SP</div>
  <div>
    <div class="title">SIEM Predictor</div>
    <div style="color:var(--muted);font-size:13px;margin-top:4px">Qradar• Live demo</div>
  </div>
</header>

<section class="card">
  <div class="chart-title">🚨 Critical Offenses (Live)</div>
  <div class="list" id="offenceList">
    <div class="item" style="justify-content:center;color:var(--muted);">⏳ Waiting for data...</div>
  </div>
</section>

<footer>Images & UI inspired by SIEM dashboards • live demo</footer>

<script>
(function(){
  const offenceList = document.getElementById('offenceList');
  const source = new EventSource("/stream"); // connect to your SSE endpoint

  function renderOffences(offences){
    offenceList.innerHTML = "";
    if(!offences || offences.length===0){
      offenceList.innerHTML = '<div class="item" style="justify-content:center;color:var(--muted);">⌛ No critical offense found yet ...</div>';
      return;
    }

    offences.sort((a,b)=> b.probability - a.probability);
    offences.forEach(off => {
      const percent = ((off.probability||0)*100).toFixed(1);
      const item = document.createElement('div');
      item.className = "item";
      item.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="badge">#${off.id}</div>
          <span style="font-weight:600;">${off.event_info|| "N/A"}</span>
        </div>
        <div style="width:60px; height:5px; border-radius:2px; background: linear-gradient(to right, #ff4d4d ${percent}%, rgba(255,77,77,0.1) ${percent}% 100%);"></div>
      `;
      offenceList.appendChild(item);
    });
  }

  source.onmessage = function(event){
    const data = JSON.parse(event.data);
    renderOffences(data);
  };
})();
</script>
</body>
</html>
